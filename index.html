<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المحل والمبيعات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h2><i class="fas fa-store"></i> إدارة المبيعات والمخزون</h2>
            <p id="current-date-display" class="date-badge"></p>
        </header>

        <!-- لوحة ملخص اليوم -->
        <div class="stats-container">
            <div class="stat-box">
                <h4>مبيعات اليوم <i class="fas fa-calendar-day"></i></h4>
                <span id="today-sales">0.00 $</span>
            </div>
            <div class="stat-box">
                <h4>إجمالي المنتجات بالمخزون</h4>
                <span id="total-products">0</span>
            </div>
        </div>

        <!-- إضافة منتج للمخزون -->
        <div class="section-box">
            <h3><i class="fas fa-boxes"></i> إضافة منتج جديد للمخزون</h3>
            <form id="product-form">
                <input type="text" id="product-name" placeholder="اسم المنتج" required>
                <div class="form-row">
                    <input type="number" id="product-price" placeholder="السعر ($)" step="0.01" required>
                    <input type="number" id="product-qty" placeholder="الكمية" required>
                </div>
                <button type="submit" class="btn-main"><i class="fas fa-plus"></i> إضافة للمخزون</button>
            </form>
        </div>

        <!-- جدول المخزون -->
        <div class="section-box">
            <h3><i class="fas fa-list"></i> قائمة المخزون الحالية</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>المنتج</th>
                            <th>السعر</th>
                            <th>الكمية</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list"></tbody>
                </table>
            </div>
        </div>

        <!-- سجل المبيعات اليومية والبحث بالأرشيف -->
        <div class="section-box">
            <h3><i class="fas fa-file-invoice-dollar"></i> سجل الفواتير والمبيعات</h3>
            <div class="filter-row">
                <label>تصفح الأرشيف حسب التاريخ:</label>
                <input type="date" id="archive-date-picker">
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>الزبون</th>
                            <th>المنتج</th>
                            <th>الصافي</th>
                            <th>الفاتورة</th>
                        </tr>
                    </thead>
                    <tbody id="sales-history-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة منبثقة للبيع وإدخال بيانات الفاتورة -->
    <div class="modal" id="sell-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeSellModal()">&times;</span>
            <h3><i class="fas fa-shopping-cart"></i> إتمام عملية بيع</h3>
            <p id="modal-product-info"></p>
            <form id="sell-form">
                <input type="hidden" id="sell-product-id">
                <input type="text" id="customer-name" placeholder="اسم الزبون" required>
                <div class="form-row">
                    <input type="number" id="sell-qty" placeholder="الكمية المباعة" min="1" value="1" required>
                    <input type="number" id="sell-discount" placeholder="الحسوم / الخصم ($)" value="0" step="0.01">
                </div>
                <textarea id="sell-notes" placeholder="ملاحظات حول العملية (اختياري)"></textarea>
                <button type="submit" class="btn-success"><i class="fas fa-check"></i> تأكيد البيع وإصدار الفاتورة</button>
            </form>
        </div>
    </div>

    <!-- نافذة منبثقة لعرض الفاتورة التفصيلية -->
    <div class="modal" id="receipt-modal">
        <div class="modal-content receipt-box">
            <span class="close-modal" onclick="closeReceiptModal()">&times;</span>
            <div class="receipt-header">
                <h2>فاتورة مبيعات</h2>
                <p id="receipt-date"></p>
            </div>
            <hr>
            <div class="receipt-body" id="receipt-body-content"></div>
            <hr>
            <button onclick="window.print()" class="btn-main"><i class="fas fa-print"></i> طباعة الفاتورة</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
